name: Verify Fixtures

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  verify-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify fixture snapshots
        run: node scripts/verify-fixtures.js
